<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Senha</title>
  <link rel="stylesheet" href="recuperar.css" />
</head>
<body>
  <header class="topo">
  
    <a href="login.html" class="entrar">Voltar</a>
  </header>

  <main class="conteudo">
    <p>Digite seu e-mail para recuperar sua senha:</p>
    <form action="#" method="post">
      <input type="email" name="email" placeholder="Seu e-mail" required style="padding: 10px; width: 100%; max-width: 400px; margin-bottom: 20px;" />
      <br />
      <button type="submit" style="padding: 10px 20px; border: none; background-color: #444; color: white; border-radius: 5px;">Enviar</button>
    </form>
  </main>

<script src="recuperar.js"></script>

</body>
</html>
