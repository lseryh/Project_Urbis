<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1 class="feed">Cadastro</h1>
    <a href="login.html" class="entrar">Voltar</a>
  </header>

  <main class="conteudo">
    <form id="formCadastro">
      <label for="nome">Nome completo:</label><br />
      <input type="text" id="nome" name="nome" required style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <label for="email">E-mail:</label><br />
      <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <label for="senha">Senha:</label><br />
      <input type="password" id="senha" name="senha" required style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <label for="cpf">CPF:</label><br />
      <input type="text" id="cpf" name="cpf" required pattern="\d{11}" title="Digite 11 números" style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <label for="telefone">Telefone:</label><br />
      <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678" style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <label for="endereco">Endereço:</label><br />
      <input type="text" id="endereco" name="endereco" style="width: 100%; padding: 10px; margin-bottom: 15px;" /><br />

      <button type="submit" style="padding: 10px 20px; background-color: #444; color: white; border: none; border-radius: 5px;">Cadastrar</button>
      
    </form>
  </main>

  <script src="./cadastro.js"></script>
</body>
</html>
